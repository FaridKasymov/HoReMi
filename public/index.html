<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лобби Плеер / Lobby Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');

        body { 
            margin: 0; color: white; font-family: 'Montserrat', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; overflow: hidden;
            transition: background-image 2s ease-in-out;
            background-size: cover; background-position: center;
            background-color: #111; 
        }
        
        #bg-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: -1; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; flex-direction: column;}
        .hidden { display: none !important; }
        
        /* Экран сопряжения */
        #pairing-screen {
            position: absolute; inset: 0; background: #111; z-index: 20; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #pairing-screen h2 { font-weight: 300; letter-spacing: 5px; margin-bottom: 20px; }
        #pairing-screen p { font-weight: 200; font-size: 20px; margin-bottom: 40px; color: #aaa; }
        #pairing-code { 
            font-size: 80px; font-weight: 400; letter-spacing: 15px; 
            border: 2px dashed rgba(255,255,255,0.2); padding: 20px 40px; border-radius: 20px;
        }

        #top-bar { position: absolute; top: 40px; right: 50px; display: flex; align-items: center; gap: 20px; }
        .widget-pill {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 24px; border-radius: 40px;
            font-size: 22px; font-weight: 200; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 12px;
        }
        #hotel-address { position: absolute; bottom: 40px; right: 50px; font-size: 18px; white-space: pre-wrap; text-align: right; line-height: 1.4; }

        .custom-block {
            position: absolute; z-index: 5;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 20px;
            font-size: 20px; font-weight: 300; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            white-space: pre-wrap; text-align: center; line-height: 1.4;
        }

/* 9 Позиций на экране */
        .pos-top-left { top: 40px; left: 50px; }
        .pos-top-center { top: 40px; left: 50%; transform: translateX(-50%); }
        .pos-top-right { top: 40px; right: 50px; }
        
        .pos-center-left { top: 50%; left: 50px; transform: translateY(-50%); }
        .pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .pos-center-right { top: 50%; right: 50px; transform: translateY(-50%); }
        
        .pos-bottom-left { bottom: 40px; left: 50px; }
        .pos-bottom-center { bottom: 40px; left: 50%; transform: translateX(-50%); }
        .pos-bottom-right { bottom: 40px; right: 50px; text-align: right; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        #hotel-logo { max-width: 300px; max-height: 200px; margin-bottom: 30px; display: none; animation: float 6s ease-in-out infinite; }
        #hotel-name { font-size: 56px; margin-bottom: 10px; font-weight: 200; letter-spacing: 10px; text-align: center; text-transform: uppercase; }

        #radio-widget { position: absolute; bottom: 40px; left: 50px; display: flex; align-items: center; gap: 15px; opacity: 0.7; }
        .equalizer { display: flex; align-items: flex-end; gap: 4px; height: 20px; }
        .eq-bar { width: 2px; background-color: white; animation: eq 1s ease-in-out infinite alternate; }
        .eq-bar:nth-child(1) { height: 10px; animation-delay: 0.0s; }
        .eq-bar:nth-child(2) { height: 20px; animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { height: 12px; animation-delay: 0.4s; }
        .eq-bar:nth-child(4) { height: 16px; animation-delay: 0.1s; }
        @keyframes eq { 0% { height: 4px; } 100% { height: 20px; } }

        #station-name { font-size: 20px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
        .pulse { animation: pulse-animation 2s infinite; font-weight: 200; letter-spacing: 2px;}
        @keyframes pulse-animation { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <!-- Экран сопряжения (Smart TV стиль) -->
    <div id="pairing-screen" class="hidden">
        <h2>ПРИВЯЗКА ЭКРАНА</h2>
        <p>Отправьте этот код боту для активации</p>
        <div id="pairing-code">------</div>
    </div>

    <div id="bg-overlay"></div>
    <div id="overlay" class="hidden">
        <h1 class="pulse">PRESS OK</h1>
    </div>

    <div id="top-bar">
        <div class="widget-pill" id="weather-widget">--°C</div>
        <div class="widget-pill" id="clock-widget">--:--</div>
    </div>
    
    <img id="hotel-logo" alt="Логотип отеля">
    <div id="hotel-name"></div>
    
    <div id="radio-widget">
        <div class="equalizer">
            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
        <div id="station-name">ПОДКЛЮЧЕНИЕ...</div>
    </div>
    <div class="widget-pill" id="hotel-address">--</div>
    
    <audio id="player"></audio>

    <script>
        const player = document.getElementById('player');
        const overlay = document.getElementById('overlay');
        const pairingScreen = document.getElementById('pairing-screen');
        const pairingCodeEl = document.getElementById('pairing-code');
        
        let currentStationUrl = "";
        const bgImages = ['1.jpg', '2.jpg', '3.jpg'];
        let currentBgIndex = 0;
        let isSlideshowRunning = false;

        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        async function checkAuth() {
            // PREVIEW РЕЖИМ
            const urlParams = new URLSearchParams(window.location.search);
            const previewSlug = urlParams.get('preview');
            
            if (previewSlug) {
                localStorage.setItem('hotel_slug', previewSlug); // Сохраняем отель
                pairingScreen.classList.add('hidden');           // Скрываем код
                overlay.classList.remove('hidden');              // PRESS OK
                return; // Выходим из функции, авторизация через бота не нужна
            }

            let token = localStorage.getItem('auth_token');
            let hotelSlug = localStorage.getItem('hotel_slug');

            if (!token || !hotelSlug) {
                pairingScreen.classList.remove('hidden');
                
                // Запрашиваем код, если токена нет
                if (!token) {
                    const res = await fetch('/api/screen/init', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'ok') {
                        token = data.auth_token;
                        localStorage.setItem('auth_token', token);
                        pairingCodeEl.innerText = data.pairing_code;
                    }
                }

                // Пингуем сервер, ждем пока админ введет код в бота
                const checkInterval = setInterval(async () => {
                    if(!token) return;
                    const res = await fetch(`/api/screen/status?token=${token}`);
                    const data = await res.json();
                    
                    if (data.status === 'paired') {
                        clearInterval(checkInterval);
                        localStorage.setItem('hotel_slug', data.hotel_slug);
                        pairingScreen.classList.add('hidden');
                        overlay.classList.remove('hidden'); // Показываем PRESS OK
                    }
                }, 3000);
            } else {
                // Если уже авторизованы
                overlay.classList.remove('hidden');
            }
        }

        // Запуск экрана после нажатия PRESS OK
        overlay.addEventListener('click', () => {
            overlay.classList.add('hidden');
            player.play().catch(() => console.log("Ожидание трека...")); 
            
            fetchData(); 
            setInterval(fetchData, 5000); 
            fetchWeather();
            setInterval(fetchWeather, 1800000); 
        });

        async function fetchData() {
            const hotelSlug = localStorage.getItem('hotel_slug');
            if (!hotelSlug) return;

            try {
                const response = await fetch(`/api/display?hotel=${hotelSlug}`);
                const data = await response.json();

                if (data.status === 'ok') {
                    document.getElementById('hotel-name').innerText = data.hotel.name;
                    document.getElementById('station-name').innerText = data.station.title; 
                    
                    // Адрес теперь поддерживает Enter
                    document.getElementById('hotel-address').innerText = data.hotel.address || "";

                    // --- РЕНДЕР ИНФО-БЛОКОВ ---
                    // Удаляем старые блоки перед обновлением
                    document.querySelectorAll('.custom-block').forEach(el => el.remove());
                    
                    // Создаем новые
                    if (data.blocks) {
                        data.blocks.forEach(b => {
                            const el = document.createElement('div');
                            el.className = `custom-block pos-${b.position}`;
                            el.innerText = b.content; // textInner тоже сохраняет переносы
                            document.body.appendChild(el);
                        });
                    }
                    const assetsPath = data.hotel.assets_path;
                    const hotelLogo = document.getElementById('hotel-logo');
                    hotelLogo.src = `/public/${assetsPath}/logo.png`;
                    hotelLogo.style.display = "block"; 

                    if (!isSlideshowRunning) {
                        isSlideshowRunning = true;
                        document.body.style.backgroundImage = `url('/public/${assetsPath}/${bgImages[0]}')`;
                        
                        setInterval(() => {
                            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
                            const nextImageUrl = `/public/${assetsPath}/${bgImages[currentBgIndex]}`;
                            const img = new Image();
                            img.src = nextImageUrl;
                            img.onload = () => { document.body.style.backgroundImage = `url('${nextImageUrl}')`; };
                        }, 10000); 
                    }

                    if (data.station.url !== currentStationUrl && data.station.url !== "") {
                        currentStationUrl = data.station.url;
                        player.src = currentStationUrl;
                        player.play();
                    }
                }
            } catch (error) { console.error("Ошибка связи с сервером", error); }
        }

        // Часы и погода
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-widget').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        setInterval(updateClock, 1000); updateClock();

        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather/v1/forecast');
                const result = await response.json();
                if (result.status === 'ok') {
                    const temp = Math.round(result.data.current_weather.temperature);
                    const sign = temp > 0 ? '+' : '';
                    document.getElementById('weather-widget').innerText = `${sign}${temp}°C`;
                }
            } catch (e) {}
        }

        // Старт логики
        checkAuth();
    </script>
</body>
</html>
